name: snapshot

# Primary trigger: cron-job.org → workflow_dispatch at HH:01 every hour (on time).
# Backup: GitHub's own schedule (often runs late; GoldBot ignores a second upload in the same hour).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Test: send all 3 layouts now, even on a weekend"
        type: boolean
        default: false
      dry_run:
        description: "Test: capture only, don't send to GoldBot"
        type: boolean
        default: false
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Market hours check (Asia/Bangkok)
        id: day
        run: |
          # gold trades ~Mon 05:00 → Sat 05:00 Bangkok; skip installs while it's closed
          dow=$(TZ=Asia/Bangkok date +%u); hr=$((10#$(TZ=Asia/Bangkok date +%H)))
          closed=false
          if [ "$dow" -eq 7 ] || { [ "$dow" -eq 6 ] && [ "$hr" -ge 5 ]; } || { [ "$dow" -eq 1 ] && [ "$hr" -lt 5 ]; }; then closed=true; fi
          if [ "$closed" = true ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Gold market closed (Bangkok) — skipping"
          fi

      - uses: actions/checkout@v4
        if: steps.day.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.day.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.day.outputs.skip != 'true'
        run: npm ci

      - name: Cache Playwright browser
        if: steps.day.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.day.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture + send to GoldBot
        if: steps.day.outputs.skip != 'true'
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          TV_SESSION_ID_SIGN: ${{ secrets.TV_SESSION_ID_SIGN }}
          GOLDBOT_URL: ${{ secrets.GOLDBOT_URL }}
          SNAPSHOT_TOKEN: ${{ secrets.SNAPSHOT_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node run.mjs
      # No artifact upload on purpose: this repo is public and the charts show private indicators.
